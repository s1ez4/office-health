# Выпуск релиза: git tag v1.0.0 && git push origin v1.0.0
name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # чтобы создать релиз и загрузить в него файлы

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # вся история — GoReleaser пишет по ней список изменений

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
